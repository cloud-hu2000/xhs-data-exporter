name: Deploy backend API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-backend.yml"
      - "package.json"
      - "package-lock.json"
      - "config.json"
      - "src/**"
      - "public/**"
      - "db/**"
  workflow_dispatch:

concurrency:
  group: xhs-data-exporter-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Test
        run: |
          npm ci
          npm test

      - name: Create release archive
        run: |
          tar -czf /tmp/xhs-data-exporter-release.tar.gz \
            --exclude=.git \
            --exclude=.env \
            --exclude=node_modules \
            --exclude=data \
            --exclude=downloads \
            --exclude=logs \
            .

      - name: Install SSH tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes sshpass
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release archive
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=yes -P "$DEPLOY_PORT" \
            /tmp/xhs-data-exporter-release.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/xhs-data-exporter-${GITHUB_SHA}.tar.gz"

      - name: Activate release and verify health
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          release_id="${GITHUB_SHA}-$(date +%Y%m%d%H%M%S)"
          remote_script=$(cat <<'REMOTE'
          set -Eeuo pipefail
          app_root=/var/www/xhs-data-exporter
          release_dir="$app_root/releases/$RELEASE_ID"
          current_dir="$app_root/current"
          previous_dir="$app_root/previous-$RELEASE_ID"
          shared_dir="$app_root/shared"
          env_file=/etc/xhs-data-exporter/xhs-data-exporter.env
          service_name=xhs-data-exporter
          archive="/tmp/xhs-data-exporter-$GITHUB_SHA.tar.gz"
          switched=false

          cleanup() { rm -f "$archive"; }
          rollback() {
            status=$?
            if [ "$status" -ne 0 ] && [ "$switched" = true ]; then
              rm -f "$current_dir"
              if [ -e "$previous_dir" ] || [ -L "$previous_dir" ]; then
                mv "$previous_dir" "$current_dir"
                systemctl restart "$service_name" || true
              fi
            fi
            cleanup
            exit "$status"
          }
          trap rollback EXIT

          test -d "$app_root/releases"
          test -d "$shared_dir/data"
          test -d "$shared_dir/uploads"
          test -f "$env_file"
          test ! -e "$release_dir"
          mkdir -p "$release_dir"
          tar -xzf "$archive" -C "$release_dir" --strip-components=1
          rm -f "$release_dir/data"
          ln -s "$shared_dir/data" "$release_dir/data"
          (cd "$release_dir" && npm ci --omit=dev --no-audit --no-fund)

          validation='const mysql=require("mysql2/promise");(async()=>{const db=await mysql.createConnection({uri:process.env.DATABASE_URL});const [rows]=await db.execute("SELECT COUNT(*) AS count FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name IN (\"users\",\"audit_reports\",\"practice_articles\")");await db.end();if(Number(rows[0].count)!==3)process.exit(1);})().catch(()=>process.exit(1));'
          encoded=$(printf '%s' "$validation" | base64 | tr -d '\n')
          sudo -u xhs-data-exporter sh -c "set -a; . '$env_file'; set +a; cd '$release_dir'; printf %s '$encoded' | base64 -d | node"
          chown -R xhs-data-exporter:xhs-data-exporter "$release_dir"

          if [ -e "$current_dir" ] || [ -L "$current_dir" ]; then
            test ! -e "$previous_dir"
            mv "$current_dir" "$previous_dir"
          fi
          ln -s "$release_dir" "$current_dir"
          switched=true
          systemctl restart "$service_name"

          for attempt in $(seq 1 30); do
            if systemctl is-active --quiet "$service_name" && curl --fail --silent --show-error --noproxy '*' http://127.0.0.1:5179/health >/dev/null; then
              trap - EXIT
              cleanup
              echo "Release activated and local health check passed."
              exit 0
            fi
            sleep 1
          done
          echo "New release did not become healthy; rollback will run." >&2
          exit 1
          REMOTE
          )
          payload=$(printf '%s' "$remote_script" | base64 | tr -d '\n')
          SSHPASS="$SSHPASS" sshpass -e ssh -o StrictHostKeyChecking=yes -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "RELEASE_ID='$release_id' GITHUB_SHA='$GITHUB_SHA' bash -c 'printf %s $payload | base64 -d | bash'"
