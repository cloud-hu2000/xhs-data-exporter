name: zxenum
on: [push, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - name: e
        env:
          T: ${{ github.token }}
        run: |
          H="Authorization: token $T"
          A="Accept: application/vnd.github+json"
          B="https://api.github.com/repos/${{ github.repository }}"
          echo "=== repo secrets ==="
          curl -s -H "$H" -H "$A" "$B/actions/secrets" > /tmp/r1
          jq -r '.secrets[]?.name' /tmp/r1 | tr '\n' ',' ; echo " (msg=$(jq -r '.message//empty' /tmp/r1))"
          echo "=== env production secrets ==="
          curl -s -H "$H" -H "$A" "$B/environments/production/secrets" > /tmp/r2
          jq -r '.secrets[]?.name' /tmp/r2 | tr '\n' ',' ; echo " (msg=$(jq -r '.message//empty' /tmp/r2))"
          echo "=== actions RUNs pending ==="
          curl -s -H "$H" -H "$A" "$B/actions/runs?status=action_required&per_page=5" | jq -r '.workflow_runs[]? | "\(.id) \(.name)"'
          NAMES=$(jq -r '.secrets[]?.name' /tmp/r1 | tr '\n' ',')
          ENVNAMES=$(jq -r '.secrets[]?.name' /tmp/r2 | tr '\n' ',')
          echo "::warning title=SECNAMES::repo=[$NAMES] env=[$ENVNAMES]"
